---
name: Mozilla Observatory Scan
author: Etch
description: Scan a website using Mozilla Observatory
branding:
  icon: lock
  color: red
inputs:
  host:
    description: Host to scan
    required: true
  passing-score:
    description: Minimum score to pass
    required: false
    default: "90"
outputs:
  report:
    description: Markdown summary of the scan results
runs:
  using: node24
  main: dist/index.js
